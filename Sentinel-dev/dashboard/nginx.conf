# nginx fait deux choses :
#   1) il sert la page web du dashboard
#   2) il transmet /api/... à l'API (le dashboard, l'ESP et l'IA passent tous par le port 8080)


server_tokens off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self'" always;

    client_max_body_size 16k;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
