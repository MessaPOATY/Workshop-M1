# Config de DÉPART (réseau de test).
# allow_anonymous true = n'importe qui peut publier et lire.
# mots de passe (password_file), droits par canal (acl_file) et TLS (listener 8883). Voir docs/SECURITE.md.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
